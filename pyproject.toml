[tool.typos.files]
ignore-hidden = false
# Translated READMEs: typos checks English spelling only.
extend-exclude = ["docs/readme/"]

[tool.typos.default]
# Unicode code point ranges (U+0100-02BA) in inlined font CSS are hex, not words.
extend-ignore-re = ["U\\+[0-9A-Fa-f]{1,6}(-[0-9A-Fa-f]{1,6})?"]

[tool.typos.default.extend-words]
# Escaped café filenames test Unicode handling.
caf = "caf"
# English ordinal suffix in 2nd, parsed by the client's reset-time protocol.
nd = "nd"
