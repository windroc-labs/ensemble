    "ensemble.orchestrator -> ensemble.orchestrator.engine",
    "ensemble.orchestrator.engine -> ensemble.orchestrator.engine.log ensemble.orchestrator.engine.issues ensemble.orchestrator.engine.run_comments ensemble.orchestrator.engine.types ensemble.orchestrator.engine.flow.handoff ensemble.orchestrator.engine.flow.tracker ensemble.orchestrator.engine.flow.types ensemble.orchestrator.engine.flow.workflow ensemble.orchestrator.trackers.linear.client ensemble.delegate ensemble.utils",
    "ensemble.orchestrator.engine.flow.handoff -> ensemble.orchestrator.engine.flow.types ensemble.utils",
    "ensemble.orchestrator.engine.flow.tracker -> ensemble.orchestrator.engine.flow.types",
    "ensemble.orchestrator.engine.flow.workflow -> ensemble.orchestrator.engine.flow.types",
    "ensemble.orchestrator.engine.log -> ensemble.orchestrator.engine.types ensemble.utils",
    "ensemble.orchestrator.engine.issues -> ensemble.orchestrator.engine.flow.handoff ensemble.orchestrator.engine.flow.types ensemble.orchestrator.engine.flow.workflow ensemble.utils",
    "ensemble.orchestrator.engine.run_comments -> ensemble.orchestrator.engine.types ensemble.delegate ensemble.utils",
    "ensemble.orchestrator.engine.types -> ensemble.orchestrator.engine.flow.tracker ensemble.orchestrator.engine.flow.types ensemble.delegate ensemble.utils",
    "ensemble.orchestrator.issue -> ensemble.orchestrator.engine ensemble.orchestrator.engine.types ensemble.orchestrator.engine.flow.types ensemble.orchestrator.trackers.linear ensemble.orchestrator.trackers.linear.client ensemble.orchestrator.trackers.local ensemble.delegate",
    "ensemble.orchestrator.trackers.linear -> ensemble.orchestrator.trackers.linear.client ensemble.orchestrator.trackers.linear.ops ensemble.orchestrator.trackers.linear.linear_tracker ensemble.orchestrator.engine.types ensemble.orchestrator.engine.flow.types",
    "ensemble.orchestrator.trackers.linear.linear_tracker -> ensemble.orchestrator.trackers.linear.ops ensemble.orchestrator.engine ensemble.orchestrator.engine.types ensemble.orchestrator.engine.flow.handoff ensemble.orchestrator.engine.flow.tracker ensemble.orchestrator.engine.flow.types ensemble.utils",
    "ensemble.orchestrator.trackers.linear.client -> ensemble.orchestrator.engine.types ensemble.utils",
    "ensemble.orchestrator.trackers.linear.ops -> ensemble.orchestrator.engine.types ensemble.utils",
    "ensemble.orchestrator.trackers.local -> ensemble.orchestrator.engine.flow.handoff ensemble.orchestrator.engine.flow.tracker ensemble.orchestrator.engine.flow.types ensemble.orchestrator.engine.types",
    "ensemble.orchestrator.cli -> ensemble.orchestrator.engine ensemble.orchestrator.engine.log ensemble.orchestrator.engine.issues ensemble.orchestrator.engine.run_comments ensemble.orchestrator.engine.types ensemble.orchestrator.issue ensemble.orchestrator.trackers.linear.client ensemble.orchestrator.trackers.linear.ops ensemble.orchestrator.trackers.linear.linear_tracker ensemble.orchestrator.trackers.local ensemble.delegate ensemble.utils",
]

[[tool.importlinter.contracts]]
name = "engine imports no tracker"
type = "forbidden"
source_modules = ["ensemble.orchestrator.engine"]
forbidden_modules = ["ensemble.orchestrator.trackers"]
# the router's Linear transport
ignore_imports = [
    "ensemble.orchestrator.engine.router -> ensemble.orchestrator.trackers.linear.client",
]

[[tool.importlinter.contracts]]
name = "trackers import no board rule"
type = "forbidden"
source_modules = ["ensemble.orchestrator.trackers"]
forbidden_modules = [
    "ensemble.orchestrator.engine.router",
    "ensemble.orchestrator.engine.promote",
    "ensemble.orchestrator.engine.prune",
    "ensemble.orchestrator.engine.writeback",
]

[[tool.importlinter.contracts]]
name = "orchestrator tests respect layer ownership"
type = "forbidden"
source_modules = ["tests.orchestrator"]
forbidden_modules = ["tests.case", "tests.checks", "tests.guard_checks", "tests.guard_data", "tests.guard_samples", "tests.guards", "tests.help_probe", "tests.import_contracts", "tests.import_policy", "tests.integration", "tests.unit", "tests.unit_imports", "ensemble.manager", "tests.manager"]

[[tool.importlinter.contracts]]
