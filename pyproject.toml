[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = [
    "E101", "E401", "E402", "E701", "E702", "E703", "E711", "E712", "E713", "E714",
    "E721", "E722", "E731", "E741", "E742", "E743", "E902", "F",
    "UP", "B", "SIM", "I", "ERA001", "PLR0917", "PLR0133",
    "ARG001", "ARG004", "ARG005", "TID", "BLE", "TRY002", "TRY201", "TRY203", "TRY300",
    "TRY400", "TRY401", "FBT", "T100",
]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.format]

[tool.pyright]
typeCheckingMode = "basic"
reportUnnecessaryComparison = "error"
reportUnnecessaryCast = "error"
pythonVersion = "3.11"
include = ["src/ensemble", ".github/worker_codex.py", ".github/worker_codex"]
extraPaths = ["src"]

[tool.vulture]
paths = [
    "src",
    ".github/vulture_whitelist.py",
]

[tool.importlinter]
include_external_packages = true
contract_types = ["units: tests.import_contracts.UnitsContract"]
root_packages = ["ensemble", "tests"]

[[tool.importlinter.contracts]]
name = "Production layers"
type = "layers"
layers = ["ensemble.manager", "ensemble.orchestrator", "ensemble.delegate", "ensemble.session", "ensemble.utils"]

[[tool.importlinter.contracts]]
name = "Manager communicates with layers only through commands"
type = "forbidden"
source_modules = ["ensemble.manager"]
forbidden_modules = ["ensemble.session", "ensemble.delegate", "ensemble.orchestrator"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "Manager units own commands, bookkeeping and events"
type = "units"
container = "ensemble.manager"
units = ["ensemble.manager.engine.crew", "ensemble.manager.engine.holder", "ensemble.manager.engine.roster", "ensemble.manager.engine.events", "ensemble.manager.engine.pr", "ensemble.manager.engine.types"]
dependencies = [
    "ensemble.manager.engine.crew -> ensemble.manager.engine.pr ensemble.manager.engine.roster ensemble.manager.engine.types ensemble.utils",
    "ensemble.manager.engine.holder -> ensemble.manager.engine.roster ensemble.manager.engine.types ensemble.utils",
    "ensemble.manager.engine.roster -> ensemble.manager.engine.events ensemble.manager.engine.types ensemble.utils",
    "ensemble.manager.engine.events -> ensemble.manager.engine.types ensemble.utils",
    "ensemble.manager.engine.pr -> ensemble.utils",
    "ensemble.manager.engine.types -> ensemble.utils",
    "outside -> ensemble.manager.engine.crew ensemble.manager.engine.holder ensemble.manager.engine.types ensemble.utils",
]

[[tool.importlinter.contracts]]
name = "manager uses lower public packages"
type = "forbidden"
source_modules = ["ensemble.manager", "tests.manager"]
forbidden_modules = ["ensemble.orchestrator.*", "ensemble.delegate.*", "ensemble.session.*", "ensemble.utils.*"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "manager tests respect layer ownership"
type = "forbidden"
source_modules = ["tests.manager"]
forbidden_modules = ["tests.case", "tests.checks", "tests.guard_checks", "tests.guard_data", "tests.guard_samples", "tests.guards", "tests.help_probe", "tests.import_contracts", "tests.import_policy", "tests.integration", "tests.unit", "tests.unit_imports"]

[[tool.importlinter.contracts]]
name = "orchestrator uses lower public packages"
type = "forbidden"
source_modules = ["ensemble.orchestrator", "tests.orchestrator"]
forbidden_modules = ["ensemble.delegate.*", "ensemble.session.*", "ensemble.utils.*"]
allow_indirect_imports = true
ignore_imports = [
    "tests.orchestrator.unit.engine.writeback_test -> ensemble.delegate.engine.types",
    "tests.orchestrator.integration.promote_integration_test -> ensemble.delegate.engine.config",
]

[[tool.importlinter.contracts]]
name = "orchestrator reaches session only through delegate"
type = "forbidden"
source_modules = ["ensemble.orchestrator"]
forbidden_modules = ["ensemble.session"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "Linear transport, operations and reporting have one direction"
type = "units"
container = "ensemble.orchestrator"
units = ["ensemble.orchestrator", "ensemble.orchestrator.cli", "ensemble.orchestrator.engine", "ensemble.orchestrator.engine.log", "ensemble.orchestrator.engine.issues", "ensemble.orchestrator.engine.run_comments", "ensemble.orchestrator.engine.types", "ensemble.orchestrator.engine.flow", "ensemble.orchestrator.engine.flow.handoff", "ensemble.orchestrator.engine.flow.tracker", "ensemble.orchestrator.engine.flow.types", "ensemble.orchestrator.engine.flow.workflow", "ensemble.orchestrator.issue", "ensemble.orchestrator.trackers", "ensemble.orchestrator.trackers.linear", "ensemble.orchestrator.trackers.linear.client", "ensemble.orchestrator.trackers.linear.ops", "ensemble.orchestrator.trackers.linear.linear_tracker", "ensemble.orchestrator.trackers.local"]
