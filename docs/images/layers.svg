<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="822" viewBox="0 0 1200 822" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
<title id="t">ensemble layers</title>
<desc id="d">Four layers stacked, each calling only the one below. From the top: you talk to the Manager, the user interface, which launches workers, role runs and board runs, watches them and reports back. Orchestrator runs many issues at once through stages defined by a workflow file; the packaged workflow is research, then PRD, then build. It reads and writes issues through the replaceable Tracker interface, implemented by Linear and Local board (Markdown files), or your own tracker. Delegate is the role layer: roles (researcher, pm, engineer) and their tasks; it runs one role on one task and returns a checked outcome. Session is the client adapter: one interface for any agent client, Claude Code, Codex, OpenCode or any other, hosted in tmux or a Docker container. Session and Delegate are general building blocks you can use alone.</desc>
