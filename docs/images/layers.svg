<text x="773" y="137.5" font-family="sans-serif" font-size="20" font-weight="700" fill="#0f172a" text-anchor="start">Session</text>
<text x="773" y="161.5" font-family="sans-serif" font-size="15" font-weight="400" fill="#334155" text-anchor="start">Client lifecycle</text>
