<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="350" viewBox="0 0 1000 350" role="img" aria-labelledby="title desc">
<title id="title">Coordinate runs directly or through a commander</title>
<desc id="desc">The user can direct workers individually, or talk to a commander agent that uses Crew commands to coordinate them.</desc>
<defs>
