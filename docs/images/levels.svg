<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="242" viewBox="0 0 1000 242" role="img" aria-labelledby="title desc">
<title id="title">Choose the scope of a run</title>
<desc id="desc">Three independent entry points: worker, role and task, board workflow.</desc>
<defs>
<marker id="arrow-control" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8 Z" fill="#2563eb"/></marker>
<marker id="arrow-cred" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8 Z" fill="#7c3aed"/></marker>
<marker id="arrow-network" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8 Z" fill="#0f766e"/></marker>
<marker id="arrow-muted" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8 Z" fill="#64748b"/></marker>
</defs>
<rect x="0" y="0" width="1000" height="242" rx="0" fill="#ffffff"/>
<rect x="1" y="1" width="998" height="240" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="35" y="36" font-family="sans-serif" font-size="16" font-weight="700" fill="#334155" text-anchor="start">CHOOSE THE SCOPE</text>
<rect x="35" y="63" width="290" height="132" rx="12" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
<text x="53" y="110.0" font-family="sans-serif" font-size="20" font-weight="700" fill="#0f172a" text-anchor="start">Worker</text>
<text x="53" y="134.0" font-family="sans-serif" font-size="15" font-weight="400" fill="#334155" text-anchor="start">One client conversation</text>
<text x="53" y="155.0" font-family="sans-serif" font-size="15" font-weight="400" fill="#334155" text-anchor="start">ensemble-session</text>
<rect x="355" y="63" width="290" height="132" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
<text x="373" y="110.0" font-family="sans-serif" font-size="20" font-weight="700" fill="#0f172a" text-anchor="start">Role + task</text>
<text x="373" y="134.0" font-family="sans-serif" font-size="15" font-weight="400" fill="#334155" text-anchor="start">A charter and checked outcome</text>
<text x="373" y="155.0" font-family="sans-serif" font-size="15" font-weight="400" fill="#334155" text-anchor="start">/ensemble:act-as</text>
<rect x="675" y="63" width="290" height="132" rx="12" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.5"/>
<text x="693" y="110.0" font-family="sans-serif" font-size="20" font-weight="700" fill="#0f172a" text-anchor="start">Board workflow</text>
<text x="693" y="134.0" font-family="sans-serif" font-size="15" font-weight="400" fill="#334155" text-anchor="start">Issues routed across roles</text>
<text x="693" y="155.0" font-family="sans-serif" font-size="15" font-weight="400" fill="#334155" text-anchor="start">ensemble-orchestrator</text>
<text x="35" y="223" font-family="sans-serif" font-size="15" font-weight="400" fill="#334155" text-anchor="start">Start at any entry point.</text>
</svg>
