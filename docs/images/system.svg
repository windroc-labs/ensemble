<text x="40" y="62" font-size="24" fill="#0f172a" font-weight="700" text-anchor="start" letter-spacing="-0.3">Flexible hosts: local or Docker</text>
<text x="40" y="90" font-size="14" fill="#64748b" font-weight="500" text-anchor="start">Each session runs on a Host you pick. In Docker it is isolated, so the client can run in yolo mode.</text>
<text x="40" y="112" font-size="14" fill="#64748b" font-weight="500" text-anchor="start">The broker keeps the logins and hands each container only its own credentials.</text>

