<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="670" viewBox="0 0 1200 670" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
<title id="t">Flexible hosts: local or Docker</title>
<desc id="d">Each session runs on a Host you pick. You talk to the manager (Claude Code, Codex or OpenCode), which starts workers through ensemble-session; workers use the same clients. On the Local Host, tmux, the client runs on your machine as you: not isolated, auto mode. On the Docker Host the session asks ensemble-broker to start and close its own container: isolated, so its client runs in yolo mode by default. The broker, root-owned, reads its own login keychain items, which only it reads once logged in; the App key and the Codex refresh token stay with it. At start it writes the container's own credentials to a tmpfs: GitHub tokens valid an hour, renewed and revoked at close; a Codex access token without its refresh token; a Claude setup-token copy deleted with the container. The container's workspace volume is kept across restart and resume. It cannot reach the host keychain, the optional Linear tracker keys (a local board needs none), the host gh login or the Docker socket, but reaches the host's services listening on 127.0.0.1, an accepted risk. It clones, pushes and opens draft pull requests on GitHub as the App bot; its work reaches the Mac only through GitHub.</desc>
