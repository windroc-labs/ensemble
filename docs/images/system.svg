<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="710" viewBox="0 0 1000 710" role="img" aria-labelledby="title desc">
<title id="title">Runtime boundaries</title>
<desc id="desc">A host-side session harness controls a local guard/client or a Docker container guard/client. The macOS broker uses Keychain and delivers runtime credentials; Docker traffic passes through the egress proxy.</desc>
<defs>
<marker id="arrow-control" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8 Z" fill="#2563eb"/></marker>
<marker id="arrow-cred" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8 Z" fill="#7c3aed"/></marker>
<marker id="arrow-network" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8 Z" fill="#0f766e"/></marker>
<marker id="arrow-muted" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8 Z" fill="#64748b"/></marker>
</defs>
<rect x="0" y="0" width="1000" height="710" rx="0" fill="#ffffff"/>
<rect x="1" y="1" width="998" height="708" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="35" y="36" font-family="sans-serif" font-size="16" font-weight="700" fill="#334155" text-anchor="start">RUNTIME BOUNDARIES</text>
<text x="965" y="36" font-family="sans-serif" font-size="13" font-weight="400" fill="#334155" text-anchor="end">blue: control    purple: credentials    teal: network</text>
<rect x="20" y="59" width="960" height="532" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
<text x="40" y="84" font-family="sans-serif" font-size="15" font-weight="700" fill="#334155" text-anchor="start">macOS host</text>
<rect x="60" y="103" width="250" height="75" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
<text x="78" y="132.0" font-family="sans-serif" font-size="20" font-weight="700" fill="#0f172a" text-anchor="start">Session harness</text>
<text x="78" y="156.0" font-family="sans-serif" font-size="15" font-weight="400" fill="#334155" text-anchor="start">owns the worker lifecycle</text>
<rect x="510" y="103" width="180" height="75" rx="12" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
<text x="528" y="132.0" font-family="sans-serif" font-size="20" font-weight="700" fill="#0f172a" text-anchor="start">Broker</text>
<text x="528" y="156.0" font-family="sans-serif" font-size="15" font-weight="400" fill="#334155" text-anchor="start">build + provision</text>
<rect x="760" y="103" width="180" height="75" rx="12" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
<text x="778" y="132.0" font-family="sans-serif" font-size="20" font-weight="700" fill="#0f172a" text-anchor="start">Keychain</text>
<text x="778" y="156.0" font-family="sans-serif" font-size="15" font-weight="400" fill="#334155" text-anchor="start">long-lived logins</text>
<path d="M760 140 H690" fill="none" stroke="#7c3aed" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow-cred)"/>
<text x="725" y="124" font-family="sans-serif" font-size="13" font-weight="400" fill="#7c3aed" text-anchor="middle">read</text>
<rect x="40" y="230" width="350" height="180" rx="12" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
<text x="60" y="254" font-family="sans-serif" font-size="18" font-weight="700" fill="#0f172a" text-anchor="start">tmux Host</text>
<rect x="65" y="278" width="130" height="65" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
<text x="83" y="316.2" font-family="sans-serif" font-size="19" font-weight="700" fill="#0f172a" text-anchor="start">Guard</text>
<rect x="225" y="278" width="150" height="65" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
<text x="243" y="316.2" font-family="sans-serif" font-size="19" font-weight="700" fill="#0f172a" text-anchor="start">Client</text>
<path d="M195 310 H225" fill="none" stroke="#2563eb" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow-control)"/>
<text x="60" y="383" font-family="sans-serif" font-size="15" font-weight="400" fill="#334155" text-anchor="start">tmux display = attachment</text>
<rect x="470" y="230" width="460" height="180" rx="12" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
<text x="490" y="254" font-family="sans-serif" font-size="18" font-weight="700" fill="#0f172a" text-anchor="start">Docker Host</text>
<rect x="495" y="270" width="420" height="34" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
<text x="705" y="293" font-family="sans-serif" font-size="16" font-weight="700" fill="#5b21b6" text-anchor="middle">Runtime credential copies (tmpfs)</text>
<rect x="495" y="325" width="180" height="65" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
<text x="513" y="348.7" font-family="sans-serif" font-size="19" font-weight="700" fill="#0f172a" text-anchor="start">Guard</text>
<text x="513" y="372.7" font-family="sans-serif" font-size="15" font-weight="400" fill="#334155" text-anchor="start">main process</text>
<rect x="735" y="325" width="180" height="65" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
<text x="753" y="363.2" font-family="sans-serif" font-size="19" font-weight="700" fill="#0f172a" text-anchor="start">Client</text>
<path d="M675 357 H735" fill="none" stroke="#2563eb" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow-control)"/>
<path d="M60 140 H30 V310 H65" fill="none" stroke="#2563eb" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow-control)"/>
<path d="M310 140 H430 V357 H495" fill="none" stroke="#2563eb" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow-control)"/>
<text x="420" y="219" font-family="sans-serif" font-size="13" font-weight="400" fill="#334155" text-anchor="end">one attach channel</text>
<path d="M600 178 V205 H705 V270" fill="none" stroke="#7c3aed" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow-cred)"/>
<text x="780" y="204" font-family="sans-serif" font-size="13" font-weight="400" fill="#7c3aed" text-anchor="start">runtime copies</text>
<text x="60" y="453" font-family="sans-serif" font-size="15" font-weight="700" fill="#5b21b6" text-anchor="start">Container credentials</text>
<text x="285" y="442" font-family="sans-serif" font-size="15" font-weight="400" fill="#334155" text-anchor="start">Claude setup-token · Codex access token · OpenCode keys</text>
<text x="285" y="466" font-family="sans-serif" font-size="15" font-weight="400" fill="#334155" text-anchor="start">GitHub installation tokens · env secrets · Linear role token*</text>
<text x="285" y="489" font-family="sans-serif" font-size="13" font-weight="400" fill="#334155" text-anchor="start">* Linear role token only when requested.</text>
<rect x="640" y="510" width="260" height="65" rx="12" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.5"/>
<text x="658" y="534.0" font-family="sans-serif" font-size="20" font-weight="700" fill="#0f172a" text-anchor="start">Egress proxy</text>
<text x="658" y="558.0" font-family="sans-serif" font-size="15" font-weight="400" fill="#334155" text-anchor="start">external project</text>
<path d="M915 357 H950 V542 H900" fill="none" stroke="#0f766e" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow-network)"/>
<path d="M770 575 V630" fill="none" stroke="#0f766e" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow-network)"/>
<text x="795" y="614" font-family="sans-serif" font-size="13" font-weight="400" fill="#0f766e" text-anchor="start">outbound traffic</text>
<rect x="60" y="630" width="850" height="54" rx="12" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.5"/>
<text x="485.0" y="662.7" font-family="sans-serif" font-size="19" font-weight="700" fill="#0f172a" text-anchor="middle">Model APIs · GitHub · other services</text>
<text x="60" y="550" font-family="sans-serif" font-size="14" font-weight="400" fill="#334155" text-anchor="start">Docker network path shown.</text>
<text x="60" y="572" font-family="sans-serif" font-size="14" font-weight="400" fill="#334155" text-anchor="start">tmux displays can attach to either Host.</text>
</svg>
