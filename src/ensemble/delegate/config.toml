# DO NOT MODIFY this file. This machine's settings go in ~/.ensemble/config.local.toml, whose per-layer sections overlay each
# project's config.toml (layers and merge rules: src/ensemble/utils/config_file.py's docstring). Every key this
# file owns is a real line below, a key you set only locally with its empty default; a `# local:` line shows a value
# to copy there, uncommented. A table cannot drop a key this file sets, so a local [delegate.output] keeps this file's other
# keys in that table.
#
# Each layer reads only its own keys (paths from the repo root): the Composer (src/ensemble/delegate/composer/)
# the run keys, [output], [roles.<role>], trusted_dirs and team_dirs; src/ensemble/delegate/team/tools/repo.py
# users and trusted_dirs; src/ensemble/delegate/config.py [delegates]; the Delegate
# (src/ensemble/delegate/engine/plan.py) [policy.<client>]. [clients] and [hosts]: src/ensemble/session/config.toml.
#
# A run key's value resolves in order, each step replacing what the earlier ones set:
#   layers  this file (config.local.toml on top) → each overlay the caller passes, in order (the orchestrator's among
#           them); so a later layer's global value beats an earlier layer's role value
#   levels  within a layer: global → role ([roles.<role>])

# ── Global ──────────────────────────────────────────────
#   tier            required: model tier 1–4 (1 = strongest); the Client maps it to a model
#   effort          required: low | medium | high | xhigh | max; the Client maps it to its own effort value
#   client          required: the Client that runs the agent run (a [clients.<name>] name); the orchestrator's
#                   overlay may set it per role. The Composer passes it through unchecked
#   language        the language reports and PRDs are written in (one line); "" → no rule: the model's default
#   cwd             the dir the agent run starts in (absolute or ~ path); "" → <workdir>/agent. A resume reuses
#                   its recorded one (<workdir>/run/run.jsonl)
#   idle_timeout    positive finite seconds without a session event. In tui mode the run gives up, leaving the
#                   session open; other modes record the idle event and continue
#   show            how a started tui session is shown, when its Host can show: "" → a pane (the tmux Host: in
#                   the display's grid or split); "none" → started hidden, as with --display none (the display the run
#                   passes down, whatever --display says), until ensemble-delegate show or ensemble-session show
#                   opens a pane; else a one-line shell command run instead, {{session}} the session name. A hidden
#                   session is not shown at its start or on resume. A worker has no tmux session, so
#                   `tmux attach -t {{session}}` no longer works; run its status's attach command instead:
#                   tmux split-window "$(ensemble-session status {{session}} | jq -r .attach)"
#   users           local, global only: GitHub logins whose PR comments are the user's; [] → the gh login
#                   (ENSEMBLE_USERS replaces it; with ENSEMBLE_PR_AUTHOR set, [] → no one: team/tools/repo.py)
#   trusted_dirs    local, global only: dirs you trust (absolute or ~ path, matched by real path); [] → none. A cwd
#                   that is one or under one loads its project settings; any other, user settings only, with a stderr
#                   notice unless it is the workdir; a trusted cwd in the workdir is refused. A listed local clone's
#                   worktrees check out symlinks as links; every other checkout gets core.symlinks=false. A listed
#                   clone trusts every link in fetched origin/<branch> commits, which may point outside the worktree:
#                   list only stable paths only you write. An agent run cannot add one (no flag; the overlay rejects it)
#   team_dirs       local, global only: dirs of your own roles, tasks and templates (absolute or ~ path, matched by
#                   real path), read in order after core's team/; [] → none; never found from the cwd. Each may hold
#                   roles/, tasks/ and templates/ (each optional) of <name>.md files ([a-z0-9-] names) in team/'s
#                   formats (src/ensemble/delegate/composer/__init__.py's docstring). Add-only: a name core or another team dir
#                   defines stops the run, naming both files, so no team dir file changes or extends a core role. A team
#                   dir's role needs no [roles.<role>] (unset: the global run keys); any role's templates may name any
#                   template. It may also hold tools/, files its roles' commands run as <role team>/tools/… (the
#                   config's {{role_team}}), trusted as its text is. A team dir is refused when it, its subdirs or
#                   files (by real path) or anything in its tools/ tree (links followed) overlap the workdir, the
#                   cwd, a write dir, another dir the run adds to write or a dir the client can write (Codex: its
#                   CODEX_HOME) (src/ensemble/delegate/engine/plan.py)
#   templates, read, write, commands  as in Roles below, for a role that does not set its own; [] → none
tier = 2
effort = "high"
client = "claude"
language = "English"
templates = []
read = []
write = []
commands = []
cwd = ""
idle_timeout = 7200
show = ""
users = []
trusted_dirs = []
team_dirs = []
# local: [delegate]
# local: language = "Chinese"
# local: cwd = "~/src/<name>"
# local: users = ["octocat"]
# local: trusted_dirs = ["~/src/<name>"]
# local: team_dirs = ["~/.ensemble/team"]

# Destination; a lower level's [output] replaces the whole table.
#   type    required: github (publish to repo, branch, dir) | local (save to the caller's out path) | pull-request (a PR
#           on the target repo)
#   repo    github: required; <owner>/<name>
#   branch  github: required
#   dir     github: required; the folder in the repo
#   host    github: "" → github.com; set for GitHub Enterprise, e.g. "ghe.example.com". pull-request: the PR link's
#           host; "" → github.com, GH_HOST or a host gh is logged in to (engine/ready_gate.py hosts); set → only it
# A key "" is unset. The orchestrator needs researcher's and pm's [output] on one github.com repo and branch (local:
# below).
[output]
type = "local"
repo = ""
branch = ""
dir = ""
host = ""

# A run's Claude account is the session's choice ([clients.claude] account: src/ensemble/session/config.toml); an
# accounts table here, global, a role's or an overlay's, is a config error naming that key

# Roles: [roles.<role>], a role's run keys; its tasks are its charter's index (core's team/roles/<role>.md › Tasks). A
# role table holding task-level keys (default_task, a tasks table) is an error.
#   templates     names of team/templates/*.md inlined into the prompt; [] → none
#   read          extra dirs the agent run needs to read; `repo` is the caller's repo dir.
#                 Delegate always grants reads of core's team/, the role's team root and its tasks dir,
#                 independently of config and overlays; [] → no extra dirs. {{role_team}} is the role's team
#                 root (its team dir: team_dirs; core's team/ for a core role).
#                 Read-only: never --add-dir. Claude gets a Read(//<dir>/**) allow rule each
#                 (Read; Grep and Glob best-effort), so a file-tool write there is denied headless (-p) and prompts in
#                 tui mode, but in the shipped auto mode goes to Claude's classifier; a broad dir such
#                 as ~ pre-approves reads of its whole tree; a path with any of *?[]{}()\, refuses the run. Codex adds
#                 nothing (no read-only grant usable with -s): its workspace-write sandbox reads the whole disk; the
#                 session's default auto mode's danger-full-access, or yolo's, can write there too. A dir also in write,
#                 or inside the cwd, <workdir>/agent or a write dir, stays writable; shell commands can write there
#                 regardless
#   write         extra dirs the agent run needs to write; <workdir>/agent is always reachable; [] → none.
#                 On the Docker Host a run reads only the image's team and writes only <workdir>/agent: any other
#                 read, a write, a role cwd, a trusted_dirs project cwd or a team_dirs role refuses it
#   commands      requested shell commands (a trailing ` *` matches any arguments); the Client decides how
#                 they are approved. {{workdir}} is <workdir>/agent, {{team}} core's team/ dir, {{role_team}} the
#                 role's team root; a word holding one is shell-quoted once filled, and a prompt text writing the command
#                 with <Workdir>, <team> or <role team> gets it as approved when that quoting changed it; [] → none
# A caller may supply a costly-step brake at runtime; it has no configuration key here.
#   <run key>     tier, effort, client, language, cwd, idle_timeout, show or [output], for that role

# ── Researcher ──────────────────────────────────────────
[roles.researcher]
templates = ["research-report"]
commands = ["python3 -P {{team}}/tools/repo.py worktree --dir {{workdir}}/src *", "python3 -P {{team}}/tools/svg_check.py *", "python3 -P {{team}}/tools/report_check.py *"]
# local: [delegate.roles.researcher]
# local: cwd = "~/src/<name>"
# local: [delegate.roles.researcher.output]
# local: type = "github"
# local: repo = "<owner>/<name>"
# local: branch = "main"
# local: dir = "Research/"

# ── PM ──────────────────────────────────────────────────
[roles.pm]
templates = ["prd"]
commands = ["python3 -P {{team}}/tools/repo.py worktree --dir {{workdir}}/src *"]
# local: [delegate.roles.pm.output]
# local: type = "github"
# local: repo = "<owner>/<name>"
# local: branch = "main"
# local: dir = "Product Design/"

# ── Engineer ────────────────────────────────────────────
[roles.engineer]
effort = "xhigh"
commands = ["python3 -P {{team}}/tools/repo.py worktree --dir {{workdir}}/src *", "python3 -P {{team}}/tools/repo.py status --dir {{workdir}}/src *", "python3 -P {{team}}/tools/scope_check.py *"]

[roles.engineer.output]
type = "pull-request"

# ── Verifier ────────────────────────────────────────────
[roles.verifier]
templates = ["verify-report"]

# repo: required; "" → every verifier run is a configuration error
[roles.verifier.output]
type = "github"
repo = ""
branch = "main"
dir = "Verification/"
# local: [delegate.roles.verifier.output]
# local: repo = "<owner>/<name>"

[roles.verifier.environment]   # Environments below
name = "mini-op"
prefetch = true

# ── Dummy Tester ────────────────────────────────────────
[roles.dummy-tester]
tier = 3
effort = "low"

# Environments: the container a role run's agent starts in, on a Docker-kind
# Host. Only this file and config.local.toml set them: a caller's overlay (the orchestrator's among them) holding
# environment, environments or roles.<role>.environment is refused, and nothing in a run's input selects one.
# A run on Host <host> resolves, each step replacing the keys it sets (a list whole):
#   [environment.<host>]  the Host's default; only a Docker-kind Host has one, and it must set image and gateway. A Host
#                         without one runs a role selecting or overriding an environment as a configuration error
#   [environments.<name>] a named environment: only the keys that differ from the default; <name> as lock below
#   [roles.<role>.environment]  local: name (a named environment) and keys overriding it, or the default without name
# A result equal to this file's default (config.local.toml aside) passes no environment: the run starts as before
# environments. An in_process run has no container: it drops the environment, refusing one with lock, credentials or
# prefetch. Keys (a table refuses any other):
#   image     a local base image's tag or ID, or "@worker": ensemble's worker base (~/.ensemble/docker/worker)
#   gateway   the egress proxy's caller network the container joins (its label name)
#   plugins   in-image plugin names or pinned sources, added to [hosts.docker] plugins; [] → none
#   credentials  an opaque credential declaration, sent separately from the caller's; only the broker validates
#                and merges kinds (caller wins); unset → none
#   lock      a lock name ([a-z0-9][a-z0-9_.-]{0,62}): one running container per name; a locked run keeps its
#             container and lock until its user closes it or its client exits; unset → none
#   prefetch  true: clone the input's one Reference `Repo:` at its optional `Ref:` line into the new workspace; the
#             clone token is temporary; container credentials come only from explicit declarations
[environment.docker]
image = "@worker"
gateway = "workers"
plugins = []
prefetch = false

[environments]

# mini-op: the test Mac mini through mini-op's image and plain skill, by the names mini-op publishes; its secrets are
# `ensemble-broker login env` items
[environments.mini-op]
image = "mini-op:env"
gateway = "mini-op"
plugins = []
lock = "mini-op"

[[environments.mini-op.credentials.env]]
item = "ensemble-broker-env/mini-op-password"
file = "mini-password"

[[environments.mini-op.credentials.env]]
item = "ensemble-broker-env/mini-op-ssh-key"
file = "mini-ssh-key"

# [delegates]  takes no keys (src/ensemble/delegate/config.py refuses each one): the delegate spawns its own drive
[delegates]

# [policy.<client>]   a role run's flags and env, the Delegate's, after the session's [clients.<client>] flags and
#                     permission mode (src/ensemble/session/config.toml), which keep ensemble's own plugin off
#                     and hold every permission flag; [] → none. The system-prompt
#                     flag keeps a final reply to its outcome block, and --strict-mcp-config (Claude) or
#                     -c mcp_servers={} (Codex: the client turns off each server your Codex config names) loads no
#                     MCP server: a local list replacing this one keeps them too
[policy.claude]
flags = ["--strict-mcp-config", '--append-system-prompt=When you return your outcome, that reply is the `ensemble-outcome` fenced block alone: write no summary or other text before or after it.']

[policy.codex]
flags = ["-c", "mcp_servers={}", "-c", 'developer_instructions="When you return your outcome, that reply is the `ensemble-outcome` fenced block alone: write no summary or other text before or after it."']
