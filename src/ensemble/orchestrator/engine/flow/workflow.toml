# The default workflow: one [[stage]] table per orchestrated role, its keys the fields of Stage
# (src/ensemble/orchestrator/engine/flow/types.py). Only role and input are required; an unset
# key takes the default after its name.
# [orchestrator] workflow in ~/.ensemble/config.local.toml names a file in this format that replaces this one whole.
#   role                  a role the Delegate knows (a charter in core or [delegate] team_dirs)
#   input                 research, design or build: the role's input layout and write-back
#   next                  the stage promote hands this stage's Handoff issues to; "" (default) → the last stage
#   require_instructions  true (default) → a Handoff issue with no comment by anyone but the harness and the
#                         role apps goes back to In Review
#   title_prefix          the title prefix of this stage's issues ("<title_prefix>: <title>"); "" (default) → none
#   retitle               a done run retitles the issue "<title_prefix>: <outcome title>"; default false
#   start, done, failed   the lead of write-back's start, done and failed comments; "" → none;
#                         default "<role> started:", "<role> done:", "<role> failed:"
#   question              the lead of write-back's needs-input comment; default "Question:"
#   first_failure         the state a failed first run's issue moves to: ready or review (default)
#   approve               a done run's comment ends with the approve line; default false
#   files                 write-back's comment lists the run's files; default false
#   deliverable           a done run's comment is its done lead and summary, unquoted, and a second comment
#                         holds its deliverable as saved (<workdir>/run/out.md, or the role's document), in full;
#                         only for a role with a local [output]; default false
#   hint                  added after the needs-input comment's footer; default ""
#   ref                   build only: the description's optional Ref: line (a branch or tag) is checked and passed
#                         in the input's Ref: header; default false (Ref: lines are not read)
#   mapped_only           build only: the target repo must be the issue's mapped repo (config.toml's repo mapping);
#                         default false (a Repo: line wins)

[[stage]]
role = "researcher"
input = "research"
next = "pm"
title_prefix = "RES"
require_instructions = true
start = "Research started:"
done = ""
question = ""
failed = ""
first_failure = "ready"
hint = "To change the target repo, edit the description's `Repo:` line."

[[stage]]
role = "pm"
input = "design"
next = "engineer"
require_instructions = false       # a PRD carries enough context
title_prefix = "PRD"
retitle = true
start = "PRD started:"
done = ""
question = ""
failed = ""
approve = true

[[stage]]
role = "engineer"
input = "build"
require_instructions = true
title_prefix = "ENG"
start = "Build started:"
done = "Build ready:"
question = "Question:"
failed = "Build failed:"
files = true
