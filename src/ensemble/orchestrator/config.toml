# DO NOT MODIFY this file. This deployment's settings go in ~/.ensemble/config.local.toml, whose per-layer sections overlay each
# project's config.toml (layers and merge rules: src/ensemble/utils/config_file.py's docstring). Every key this
# file owns is a real line below: a required one you set locally has the placeholder "" (router, run and promote stop
# while one is still "" or missing), a local-only one its empty default; a `# local:` line shows a value to copy there,
# uncommented. [roles.<role>] holds only the board keys below; a role's run keys go in [core] (the overlay), its Linear
# app in [linear.roles.<role>]. [linear], at the end, holds the Linear tracker's entities and keys, required
# only with tracker = "linear".

#   tracker   local: where issues live: "local", a local board, the directory $ENSEMBLE_BOARD_DIR (default
#             ~/.ensemble/board/), its runtime state in <board>/.state/; "linear", Linear ([linear] below)
#   work_dir  local: the Linear tracker's runtime state: agent runs' workdirs <work_dir>/work/<ID>/
#             (docs/board.md: State cleanup), router state and logs in <work_dir>/logs/; absolute or ~, neither in nor containing
#             a [local_clones] clone
tracker = "local"
work_dir = "~/.ensemble"
#   workflow  local: the board's stages: a workflow file (absolute or ~) in place of the packaged one,
#             src/ensemble/orchestrator/engine/flow/workflow.toml (its header: the keys and
#             defaults), whole, nothing merged; "" → the packaged one
workflow = ""
# local: [orchestrator]
# local: tracker = "linear"
# local: work_dir = "~/.ensemble"

# Local board settings; override under [orchestrator.local] in ~/.ensemble/config.local.toml.
[local]
#   issue_prefix  used only when the board has no issues; otherwise the highest-numbered id's prefix
issue_prefix = "LOC"

# Delegate implementations; default selects new runs. Recorded kinds select existing runs.
[delegates]
default = "harness"

[delegates.harness]
implementation = "ensemble.delegate:HarnessDelegate"

# Task tiers; optional: the model tier of a run whose issue's task is listed, overlaid on its role after [core].
#   <task>  local: tier 1–4 (1 = strongest), as delegate/config.toml's tier; empty table → no change: the run keeps
#           its role's or global tier
[task_tiers]

# local: [orchestrator.task_tiers]
# local: light-build = 3

# Client run limits; optional: board runs of a client at once, across roles, counted from runs.jsonl's live runs by
# their recorded client; a run starts only when its role (max_runs) and its client both have room. router --issue
# skips the check but its runs count; ad-hoc runs and crew workers are not counted.
#   <client>  local: a client name as Delegate configures it: a whole number >= 1; unlisted → unlimited; empty table → no
#             limit
[client_max_runs]

# local: [orchestrator.client_max_runs]
# local: opencode = 1               # the host's local models run one job at a time
# local: claude = 3
# local: codex = 2

# Per-client usage checks, owned by the orchestrator; empty table or an unlisted client means "on".
#   <client>  "on": keep the board-start usage gate and researcher brake (80% five-hour usage).
#             "off": neither reads nor evaluates usage, including recorded quota holds; other clients keep their setting.
[usage_limit]

# local: [orchestrator.usage_limit]
# local: "<client>" = "off"

# An orchestrated role: each workflow stage's role is one, and a table names only a stage's role. Its tasks are its
# charter's index (roles/<role>.md › Tasks, in core or a [delegate] team_dirs dir). Its Linear app:
# [linear.roles.<role>]. A table for a packaged stage your workflow leaves out is ignored.
#   max_runs  agent runs of this role at once; 3 for these roles unless config.local.toml sets it; no table → 1
[roles.researcher]
max_runs = 3

[roles.pm]
max_runs = 3

[roles.engineer]
max_runs = 3

# local: [orchestrator.roles.engineer]
# local: max_runs = 1

# Local clones; optional, an unlisted repo gets a fresh clone.
# Host-qualified keys and host defaults: docs/board.md's Document destinations and GitHub hosts.
#   "<owner>/<name>"  local: "<path>" (absolute or ~) of the repo's local clone. The input's Repo: line names the path,
#                     so the agent run gets a git worktree of the clone; load() checks it is a clone of that
#                     repo; empty table → none
[local_clones]

# local: [orchestrator.local_clones]
# local: "<owner>/<name>" = "~/src/<name>"

# The overlay; optional: core run keys for the Linear orchestrator's agent runs, in delegate/config.toml's layout under
# [core], the last of delegate/config.toml's layers. Use explicit paths for external files.
#   <run key>  as in delegate/config.toml, local keys included (e.g. a trusted cwd); users, trusted_dirs,
#              and [clients] tables are refused; a role table holding the old
#              task-level keys is an error
[core]
# local: [orchestrator.core.roles.researcher]
# local: cwd = "~/src/<name>"

# The Linear tracker's entities and keys, by id; required only with tracker = "linear".
#   team              local, required: the Linear team id
#   human_members     local: the human users' emails; each is subscribed to every issue moved to In Review; [] → none
#   task_label_group  local, required: Linear id of the `Tasks` label group; its labels pick an issue's task through
#                     [linear.task_labels]
[linear]
team = ""
human_members = []
task_label_group = ""
agent_label_group = ""
# local: [orchestrator.linear]
# local: team = "00000000-0000-0000-0000-000000000000"
# local: human_members = ["you@example.com"]
# local: task_label_group = "00000000-0000-0000-0000-000000000000"
# local: agent_label_group = "00000000-0000-4000-8000-000000000101"

# The harness's Linear OAuth app (router, promote, prune, a run's reads and session comments): its calls send a
# client_credentials token, which every command renews when under 5 days are left; scopes are fixed (read,write).
#   client_id       local, required: the app's Client ID
#   secret_service  local, required: Keychain service of the app's client secret
#   token_service   local, required: Keychain service of its token and expiry, written by the selected writer;
#                   after rotation: for transport ownership delete this item; for broker follow docs/credentials.md#linear-broker-renewal
#   user_id         local, required: the app's Linear user id
# renewal: transport keeps the current writer; broker requires enrollment (docs/credentials.md).
[linear.harness]
renewal = "transport"
client_id = ""
secret_service = ""
token_service = ""
user_id = ""

# local: [orchestrator.linear.harness]
# local: client_id = "0123456789abcdef0123456789abcdef"
# local: secret_service = "linear-app-harness-secret"
# local: token_service = "linear-app-harness-token"
# local: user_id = "00000000-0000-0000-0000-000000000000"

# The manager's Linear OAuth app (ensemble-orchestrator issue): its calls send a client_credentials token, which the
# issue commands renew when under 5 days are left; scopes are fixed (read,write,app:assignable). Its comments and moves
# count as the user's (other), whether or not user_id is set. Any key "" → issue refuses; router, promote and prune
# run without it.
#   client_id       local, required for issue: the app's Client ID
#   secret_service  local, required for issue: Keychain service of the app's client secret
#   token_service   local, required for issue: Keychain service of its token and expiry, written by the selected writer;
#                   after rotation: for transport ownership delete this item; for broker follow docs/credentials.md#linear-broker-renewal
#   user_id         local, required for issue: the app's Linear user id; it matters only for a manager move that
#                   Linear credits to a botActor, which then counts as other too
[linear.manager]
renewal = "transport"
client_id = ""
secret_service = ""
token_service = ""
user_id = ""

# local: [orchestrator.linear.manager]
# local: client_id = "fedcba9876543210fedcba9876543210"
# local: secret_service = "linear-app-manager-secret"
# local: token_service = "linear-app-manager-token"
# local: user_id = "00000000-0000-4000-8000-000000000001"

# The team's workflow states the code uses.
#   <state>  local, required for each of backlog, todo, in_progress, in_review, handoff, done, canceled: its Linear state id
[linear.states]
backlog = ""
todo = ""
in_progress = ""
in_review = ""
handoff = ""
done = ""
canceled = ""

# local: [orchestrator.linear.states]
# local: backlog     = "00000000-0000-0000-0000-000000000000"
# local: todo        = "00000000-0000-0000-0000-000000000000"
# local: in_progress = "00000000-0000-0000-0000-000000000000"
# local: in_review   = "00000000-0000-0000-0000-000000000000"
# local: handoff     = "00000000-0000-0000-0000-000000000000"
# local: done        = "00000000-0000-0000-0000-000000000000"
# local: canceled    = "00000000-0000-0000-0000-000000000000"

# Task labels; optional: an issue without one runs its role, which picks a task from its index.
#   <task>  local: the task's Linear label id, a child of the Tasks group; empty table → none
[linear.task_labels]

# local: [orchestrator.linear.task_labels]
# local: deep-research = "00000000-0000-0000-0000-000000000000"
# local: light-research = "00000000-0000-0000-0000-000000000000"
# local: build = "00000000-0000-0000-0000-000000000000"
# local: light-build = "00000000-0000-0000-0000-000000000000"

# Agent labels; optional: set agent_label_group to the Agent group's id and map each client to its child label id.
# Both empty disables selection; otherwise set both. Client names come from Delegate configuration.
[linear.agent_labels]

# local: [orchestrator.linear.agent_labels]
# local: "<client>" = "00000000-0000-4000-8000-000000000102"

# Each stage role's OAuth app: four required fields, one table per workflow stage.
# Store secrets and token records in Keychain; user_id is the app user id from installation.
[linear.roles.researcher]
renewal = "transport"
client_id = ""
secret_service = ""
token_service = ""
user_id = ""

[linear.roles.pm]
renewal = "transport"
client_id = ""
secret_service = ""
token_service = ""
user_id = ""

[linear.roles.engineer]
renewal = "transport"
client_id = ""
secret_service = ""
token_service = ""
user_id = ""

# local: [orchestrator.linear.roles.researcher]
# local: client_id = "00000000000000000000000000000001"
# local: secret_service = "linear-app-researcher-secret"
# local: token_service = "linear-app-researcher-token"
# local: user_id = "00000000-0000-4000-8000-000000000000"
# local: [orchestrator.linear.roles.pm]
# local: client_id = "00000000000000000000000000000002"
# local: secret_service = "linear-app-pm-secret"
# local: token_service = "linear-app-pm-token"
# local: user_id = "00000000-0000-4000-8000-000000000000"
# local: [orchestrator.linear.roles.engineer]
# local: client_id = "00000000000000000000000000000003"
# local: secret_service = "linear-app-engineer-secret"
# local: token_service = "linear-app-engineer-token"
# local: user_id = "00000000-0000-4000-8000-000000000000"

# Project repos; optional.
#   "<project id>"  local: "<owner>/<name>": target repo of the Linear project's Engineering, research or
#                   product-design issues with no Repo: line; a Repo: line wins unless the stage sets mapped_only
#                   (workflow.toml); empty table → none
[linear.project_repos]

# local: [orchestrator.linear.project_repos]
# local: "00000000-0000-0000-0000-000000000000" = "<owner>/<name>"
