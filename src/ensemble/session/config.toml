# DO NOT MODIFY this file. This machine's settings go in ~/.ensemble/config.local.toml, whose per-layer sections overlay each
# project's config.toml (layers and merge rules: src/ensemble/utils/config_file.py's docstring). Every key this
# file owns is a real line below; a `# local:` line shows a value to copy there, uncommented.
#
# The session's keys: [clients.<name>], [hosts] and [viewer]. The session reads no config file: each entry reads this
# file through ensemble.session.read_config(), parses [hosts] once (Host.parse_hosts) and hands it to
# Session.configure_from; bin/ensemble-session (src/ensemble/session/cli.py) is one such entry.

# ── Clients ────────────────────────────────────────────
# [clients.<name>]  one table per client, loaded only by src/ensemble/session/clients/registry.py; <name> is the
#                    client name a Spec's client names, independent of the module and class
#   implementation   required: "module.path:Class", the Client subclass that runs it
#   max_runs         session-wide concurrent starts for this client, across every caller and mode; 0 or absent:
#                    unlimited. The session owns this key, not the Client adapter
#   any other key    the client's own (its class's `keys`); a key it does not list is a config error
# [clients.<name>.modes]  its permission modes, auto and yolo (skips every permission and approval), each a list of
#                    flags added to every launch, a resume's included, after flags; an isolated Host's sessions get
#                    yolo's, every other's auto's. The only home of a client's permission flags: a mode holds none of
#                    another mode's flags; empty → none

# [clients.claude]  Claude Code (src/ensemble/session/clients/claude/)
#   flags            claude flags added to every session command and its resume command; never --setting-sources (the
#                    session layer's); empty → none. Every --settings here and in a Spec, inline JSON or a settings
#                    file's path (relative to the session's cwd), merges into one. Default: ensemble's own plugin
#                    (<plugin>@<marketplace>) stays off in every session, workers and role runs; the user's other plugins
#                    load. A local list replaces it whole
#   allow            tool rules pre-approved for every session (--allowedTools), after the run's commands and read
#                    rules; empty → none
#   env              variables added to every command's environment, over the client's defaults; empty → none
#   account          the account (a [clients.claude.accounts.<name>]) every Docker Host start that selects none runs
#                    on, only while it is under its max_usage, never replaced; empty → each such start picks the
#                    account with the most usage left, a tie by name. Only --account overrides it
#   local_account    the same for the tmux Host; empty → a tmux start that selects none runs on the user's own
#                    config (no CLAUDE_CONFIG_DIR set: ~/.claude and its login), reading no usage, unless it
#                    resumes a conversation recorded in an account's dir outside ~/.claude: that runs on the account
# [clients.claude.modes]    auto: Claude's auto mode classifier; yolo: bypassPermissions, its first-start dialog skipped
# [clients.claude.tiers]    tier "1".."4" → its --model
# [clients.claude.efforts]  effort (low, medium, high, xhigh, max) → its --effort
#                            starting a run whose tier or effort has no entry here is a config error
# [clients.claude.accounts.<name>]  a Claude account, selected by account or local_account above or a worker's
#                    --account (ENSEMBLE_ACCOUNT); a Docker Host Claude start needs at least one. The tmux Host
#                    runs a start selecting one with its dir as CLAUDE_CONFIG_DIR; the Docker Host injects that
#                    account's setup-token alone (ensemble-broker login claude <name>); <name> 1–64 lowercase
#                    letters, digits, ., _ or -, never setup-token. Only listed accounts are registered: none is
#                    implicit, ~/.claude included; selecting an unregistered name is a config error. None
#                    packaged; no secret:
#   dir              required: its CLAUDE_CONFIG_DIR on the host, ~ expanded, absolute. The usage probe reads it, so
#                    log it in to the account whose setup-token the broker holds
#   account          a display string, e.g. its login email
#   max_usage        the percent of each usage window (five-hour and weekly alike) it may reach, 0 < max_usage
#                    <= 100; absent → 100. Before launching, each start on an account reads every registered one
#                    once, live, and runs only on one below it in every window, else fails (usage: no available
#                    account); nothing is cached or held. A /usage probe printing only a cost summary (an API
#                    key or gateway login) has no limit
[clients.claude]
implementation = "ensemble.session.clients.claude:ClaudeClient"
max_runs = 0
flags = ["--settings", '{"enabledPlugins": {"ensemble@windroc": false}}']
allow = []
account = ""
local_account = ""
# local: [session.clients.claude]
# local: allow = ["<rule>"]
# local: local_account = "<name>"

[clients.claude.modes]
auto = ["--permission-mode", "auto"]
yolo = ["--dangerously-skip-permissions", "--settings", '{"skipDangerousModePermissionPrompt": true}']

[clients.claude.env]

[clients.claude.accounts]

[clients.claude.tiers]
1 = "fable"
2 = "opus"
3 = "sonnet"
4 = "haiku"

[clients.claude.efforts]
low = "low"
medium = "medium"
high = "high"
xhigh = "xhigh"
max = "max"

# [clients.codex]   Codex (src/ensemble/session/clients/codex/)
#   flags            codex flags added before a Spec's to every launch, a resume's too; no --add-dir or --; empty → none.
#                    Default: as [clients.claude] flags', plus Codex 0.163.0's bundled browser and computer-use
#                    plugins, Apps and tool_suggest off; a plugin id stays unquoted, or the key never matches
# [clients.codex.modes]  auto: no Codex sandbox, auto-reviewed approvals; yolo: no sandbox, no approvals. Neither
#                    grants a directory, hooks, session or cwd
[clients.codex]
implementation = "ensemble.session.clients.codex:CodexClient"
max_runs = 0
flags = [
    "-c", "plugins.ensemble@windroc.enabled=false",
    "-c", "plugins.browser@openai-bundled.enabled=false",
    "-c", "plugins.chrome@openai-bundled.enabled=false",
    "-c", "plugins.chrome-dev@openai-bundled.enabled=false",
    "-c", "plugins.chrome-internal@openai-bundled.enabled=false",
    "-c", "plugins.computer-use@openai-bundled.enabled=false",
    "-c", "plugins.unified-computer-use@openai-bundled.enabled=false",
    "--disable", "apps",
    "--disable", "tool_suggest",
]

[clients.codex.modes]
auto = ["-s", "danger-full-access", "-c", 'approval_policy="on-request"', "-c", 'approvals_reviewer="auto_review"']
yolo = ["--dangerously-bypass-approvals-and-sandbox"]

[clients.codex.tiers]
1 = "gpt-6-astra"
2 = "gpt-6.1-sol"
3 = "gpt-6-luna"
4 = "gpt-5.6-terra"

[clients.codex.efforts]
low = "low"
medium = "medium"
high = "high"
xhigh = "xhigh"
max = "max"

# Launch/probe variables, including CODEX_HOME; empty → none; resume keeps the saved CODEX_HOME.
[clients.codex.env]

# [clients.opencode]  OpenCode 1.x, headless and TUI (src/ensemble/session/clients/opencode/); its models run
#                    on the host's Ollama, which stays on 127.0.0.1, or a [clients.opencode.providers] one. Each launch's
#                    OpenCode config (OPENCODE_CONFIG_CONTENT) holds the ollama provider at
#                    http://<the Host's address>:<ollama_port>/v1 and the configured providers, every other provider
#                    off (enabled_providers: OpenCode's built-in ones, OpenCode Zen's included), autoupdate off and
#                    auto's permission.bash = "ask" (but a run's pre-approved commands): headless refuses the shell call, the
#                    TUI asks and the session is blocked. OpenCode runs any cwd's .opencode plugins and opencode.json
#                    (it has no project trust), so outside an isolated Host a launch, a resume's included, whose cwd is
#                    not trusted (Access.project) is refused before it starts
#   flags            opencode flags added to every launch; never a session selector, --model, --format, --attach,
#                    --dir or a permission flag (modes'), nor for the TUI --prompt or --pure, nor for headless
#                    --title; empty → none
#   executable       the OpenCode 1.x command both modes run (a name PATH finds, or an absolute path); empty → the
#                    client's own name on PATH; a launch whose `<executable> --version` is not 1.x is refused
#   ollama_port      the host's Ollama port
#   ollama_context   its context window in tokens (OLLAMA_CONTEXT_LENGTH): ollama/ models compact before it fills
#   model            the --model of a run without a tier (ollama/<model> or <name>/<model>, as tiers'); never empty,
#                    and without it such a run is refused
#   env              variables added to every launch; never one that overrides the launch's OpenCode config
#                    (OPENCODE_PERMISSION, OPENCODE_CONFIG, OPENCODE_CONFIG_DIR, OPENCODE_CONFIG_CONTENT); empty → none
# [clients.opencode.modes]    auto: none (bash asks); yolo: --auto plus backend allow for bash/read/external_directory/
#                            doom_loop, avoiding transient permission.asked events; edit denies stay, questions still ask
# [clients.opencode.tiers]    tier "1".."4" → its --model: ollama/<model> or <name>/<model> of a providers table, which
#                             lists the model; any other provider is refused
# [clients.opencode.providers.<name>]  an OpenAI-compatible provider (e.g. a LAN server), <name> up to 64
#                    letters, digits, ., _ or -; none packaged:
#   base_url         its http(s) URL, ending /v1 (http://<host>:8080/v1)
#   models           model names it lists beside those tiers map to it; [] → only those
#   context          optional: its context window in tokens, as ollama_context; absent → 65536
#                    Its API key: on tmux, `opencode auth login` (provider <name>), which ensemble never reads;
#                    on Docker, `ensemble-broker login opencode <name>`, every listed one
# [clients.opencode.efforts]  effort → its --variant (a model without that variant ignores it)
[clients.opencode]
implementation = "ensemble.session.clients.opencode:OpenCodeClient"
max_runs = 0
# local: [session.clients.opencode]
# local: max_runs = 1
flags = []
executable = ""
ollama_port = 11434
ollama_context = 65536
model = "ollama/qwen3.6:35b-mlx"

[clients.opencode.modes]
auto = []
yolo = ["--auto"]

[clients.opencode.env]

[clients.opencode.providers]

[clients.opencode.tiers]
1 = "ollama/qwen3.6:35b-mlx"
2 = "ollama/qwen3.6:35b-mlx"
3 = "ollama/qwen3.6:35b-mlx"
4 = "ollama/qwen3.6:35b-mlx"

[clients.opencode.efforts]
low = "low"
medium = "medium"
high = "high"
xhigh = "xhigh"
max = "max"

# ── Hosts ───────────────────────────────────────────────
# [hosts]             default: the [hosts.<name>] sessions run on
#   hidden_size       "<columns>x<rows>", each 1 to 9999: every Host's tui worker's terminal size while no viewer
#                     shows it (hidden, or before any pane attaches); a shown pane follows its viewer. Only here,
#                     never in a [hosts.<name>] table
# [hosts.<name>]      one table per Host, parsed only by Host.parse_hosts (src/ensemble/session/hosts/base.py)
#   implementation    required: "module.path:Class", the Host class; checked for that form only, never loaded there
#   isolated          true → an isolation boundary (a container): its sessions' clients run in yolo mode
#                     ([clients.<name>.modes]); false → auto mode
# [hosts.tmux]
#   status_line       true → a tui worker's pane shows its name in the window's pane border
# [hosts.docker]      each tui session in its own container, made by ensemble-broker:
#   docker            the docker CLI, an absolute path
#   plugins           pinned sources: name@owner/repo#commit[::marketplace-owner/repo#commit]; []: none
#                     Both commits are full 40-hex hashes.
[hosts]
default = "tmux"
hidden_size = "80x24"
# local: [session.hosts]
# local: hidden_size = "120x40"

[hosts.tmux]
# TmuxHost (src/ensemble/session/hosts/tmux/host.py)
implementation = "ensemble.session.hosts.tmux:TmuxHost"
status_line = false
isolated = false
# local: [session.hosts.tmux]
# local: status_line = true

[hosts.docker]
# DockerHost (src/ensemble/session/hosts/docker/host.py)
implementation = "ensemble.session.hosts.docker.host:DockerHost"
docker = "/usr/local/bin/docker"
plugins = ["updraft@windroc-labs/updraft#04e59a1775c08f8f55dda53b14d19f80c7d5c8e1::windroc-labs/agent-plugins-marketplace#dbea3408ab0c113bd74f414ab3a19d820e0f6e43"]
isolated = true

# ── Viewer ──────────────────────────────────────────────
# [viewer]            how the Viewer (src/ensemble/session/viewer/viewer.py) shows every Host's sessions:
#   workers_per_column panes per tmux grid column, 1..9999
#   grid_retile       when a tmux grid re-tiles: "open-close" (a pane opens or closes), "all" (also a drag or a
#                     window resize), "off" (never by itself: ensemble-session tile @N)
[viewer]
workers_per_column = 3
grid_retile = "open-close"
# local: [session.viewer]
# local: workers_per_column = 2
# local: grid_retile = "all"
