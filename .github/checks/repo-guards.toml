function = "TestBaseCheckScript"
count = 1
reason = "Needs sh; CI runners have it, so the test runs there."

[["ci-checks/inline-exemptions/settings.toml".exemption]]
tool = "go-test"
file = "src/broker/internal/launcher/checks_test.go"
rule = "Skip"
